<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funkelnde Moleküle</title>
  <meta name="description" content="Funkelnde Moleküle. Baue berühmte Moleküle aus Atomen. Für 11 bis 13 Jahre.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e8f7ff'/%3E%3Ccircle cx='8' cy='22' r='4' fill='%23ffe08a'/%3E%3Ccircle cx='24' cy='22' r='4' fill='%23ffe08a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>
  <canvas id="motes" aria-hidden="true"></canvas>
  <nav class="langs" id="langs" aria-label="Sprache">
    <button type="button" data-lang="de" lang="de">DE</button>
    <button type="button" data-lang="en" lang="en">EN</button>
  </nav>

  <section class="screen" id="home" data-screen="home">
    <div class="home-wrap">
      <p class="eyebrow" data-i18n="eyebrow">Chemie · 11–13</p>
      <h1 id="app-title" data-i18n="appTitle">Funkelnde Moleküle</h1>
      <p class="lead" data-i18n="lead">Nimm Atome aus der Schale und stecke sie richtig zusammen.</p>
      <p class="pearl-pill" id="pearls"></p>
      <div class="modes">
        <button class="mode-card" id="open-funken" type="button">
          <span class="card-row" id="preview-funken" aria-hidden="true"></span>
          <span class="kicker" id="kicker-funken"></span>
          <span class="card-title" id="title-funken"></span>
          <span class="card-lead" id="lead-funken"></span>
          <span class="card-meta" id="meta-funken"></span>
        </button>
        <button class="mode-card" id="open-tropfen" type="button">
          <span class="card-row" id="preview-tropfen" aria-hidden="true"></span>
          <span class="kicker" id="kicker-tropfen"></span>
          <span class="card-title" id="title-tropfen"></span>
          <span class="card-lead" id="lead-tropfen"></span>
          <span class="card-meta" id="meta-tropfen"></span>
        </button>
        <button class="mode-card" id="open-feuer" type="button">
          <span class="card-row" id="preview-feuer" aria-hidden="true"></span>
          <span class="kicker" id="kicker-feuer"></span>
          <span class="card-title" id="title-feuer"></span>
          <span class="card-lead" id="lead-feuer"></span>
          <span class="card-meta" id="meta-feuer"></span>
        </button>
        <button class="mode-card finale" id="open-perle" type="button">
          <span class="card-row" id="preview-perle" aria-hidden="true"></span>
          <span class="kicker" id="kicker-perle"></span>
          <span class="card-title" id="title-perle"></span>
          <span class="card-lead" id="lead-perle"></span>
          <span class="card-meta" id="meta-perle"></span>
        </button>
      </div>
      <p class="how" data-i18n="how">Tippe ein Atom an und dann eine freie Steckstelle. Du kannst es auch hinüberziehen.</p>
      <button class="textbtn" type="button" id="reset" data-i18n="reset">Fortschritt löschen</button>
    </div>
  </section>

  <section class="screen" id="levels" data-screen="levels" hidden>
    <div class="levels-wrap">
      <div class="top">
        <button class="hudbtn" type="button" id="back-home" data-i18n="backHome">Start</button>
        <div class="grow">
          <p class="kicker" id="levels-kicker"></p>
          <h1 id="levels-title"></h1>
          <p class="lead" id="levels-lead"></p>
        </div>
      </div>
      <p class="fine" data-i18n="fine">Jeder Fehlversuch und jede Hilfe kostet einen Stern.</p>
      <div class="level-list" id="level-list"></div>
    </div>
  </section>

  <section class="screen" id="play" data-screen="play" hidden>
    <header class="top">
      <button class="hudbtn" type="button" id="back-levels" data-i18n="backLevels">Level</button>
      <div class="grow">
        <p class="kicker" id="play-kicker"></p>
        <h1 id="play-title"></h1>
      </div>
      <div class="hud-right">
        <div id="live-stars" class="stars" role="img"></div>
        <button class="hudbtn" type="button" id="sound"></button>
      </div>
    </header>
    <div class="goal-block">
      <p class="goal" id="goal"></p>
      <p class="formula" id="formula" hidden></p>
    </div>
    <div id="dish">
      <div id="float">
      <div id="ghosts" aria-hidden="true"></div>
      <svg id="links" aria-hidden="true">
        <defs>
          <filter id="pearlglow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.5" result="b"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="b"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>
        <g id="strands"></g>
      </svg>
      <div id="beads"></div>
      </div>
    </div>
    <div id="tray" aria-label="Atome"></div>
    <div class="tools">
      <button class="hudbtn" type="button" id="coach" data-i18n="coach" data-i18n-title="coachTitle">Merksatz</button>
      <button class="hudbtn" type="button" id="hint" data-i18n="hint" data-i18n-title="hintTitle">Hilfe</button>
      <button class="hudbtn" type="button" id="undo" data-i18n="undo" data-i18n-title="undoTitle">Rückgängig</button>
    </div>
    <p id="feedback" aria-live="polite"></p>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>
  <p id="cele-name" hidden></p>
  <button class="primary" type="button" id="skip" hidden>Fertig</button>

  <dialog id="done">
    <div class="done-card">
      <p class="kicker" id="done-kicker"></p>
      <h2 id="done-title"></h2>
      <div id="done-stars" class="stars big" role="img"></div>
      <p id="done-shape"></p>
      <p id="done-stats"></p>
      <div class="done-actions">
        <button class="primary" type="button" id="done-replay"></button>
        <button class="hudbtn" type="button" id="done-next"></button>
        <button class="ghost" type="button" id="done-list"></button>
      </div>
    </div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="logic.js"></script>
  <script src="celebrate.js"></script>
  <script src="app.js"></script>
</body>
</html>
